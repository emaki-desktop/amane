# The fork's own CI, for the emaki branch. A file of its own, so upstream's
# test.yml stays untouched and a rebase never conflicts here.
name: fork

on:
  push:
    branches: [emaki]
  pull_request:
  workflow_dispatch:

# the token reads the repository and does nothing else
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # the flake's dev shell lists every library amane links
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: rustfmt
        run: nix develop -c cargo fmt --check

      # needless_range_loop is allowed for upstream's image filters
      # (graphics/image/shrink.rs, soften.rs), which the fork leaves as they
      # are so a rebase doesn't conflict there
      - name: clippy
        run: nix develop -c cargo clippy --all-targets --locked -- -D warnings

      - name: clippy, with the polkit agent
        run: nix develop -c cargo clippy --all-targets --locked --features polkit-agent -- -D warnings

      # only the library tests, they run without a compositor
      - name: test
        run: nix develop -c cargo test --lib --locked --features polkit-agent

      # the dependencies: no known vulnerability or yanked crate, only allowed licences, and
      # git only from the vello fork (deny.toml)
      - name: cargo deny
        run: nix develop -c nix run nixpkgs#cargo-deny -- check

      # rustdoc's warnings (broken links, docs naming private items) fail the build; the
      # fork's modules also warn on a public item without docs (their #![warn] line)
      - name: doc
        run: nix develop -c cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # no other vendor's platform terms on the lines the fork added (emaki's
  # scripts/lint-terms, against the fork point)
  terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emaki-desktop/emaki
          path: .emaki

      - name: lint-terms
        run: .emaki/scripts/lint-terms --diff fork-base
